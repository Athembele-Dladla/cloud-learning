<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Athembele Dladla | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fff0f5;
      color: #2c2c2c;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0; width: 100%;
      background: rgba(255,240,245,0.9);
      backdrop-filter: blur(10px);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      border-bottom: 1px solid #f7c5d8;
    }
    nav .logo { font-weight: 700; font-size: 1.2rem; color: #d63384; }
    nav ul { list-style: none; display: flex; gap: 2rem; }
    nav ul a { text-decoration: none; color: #2c2c2c; font-size: 0.9rem; transition: color 0.3s; }
    nav ul a:hover { color: #d63384; }

    /* ── Hero ── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6rem 2rem 4rem;
      background: linear-gradient(135deg, #ffe4ef, #fff0f5);
    }
    .hero-avatar {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: #f7c5d8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      margin-bottom: 1.5rem;
      border: 4px solid #d63384;
    }
    .hero h1 { font-size: 3rem; font-weight: 700; color: #d63384; margin-bottom: 0.5rem; }
    .hero .subtitle {
      font-size: 1rem;
      color: #888;
      margin-bottom: 1.5rem;
      max-width: 600px;
      line-height: 1.6;
    }
    .hero-badges { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 2rem; }
    .badge {
      background: #d63384;
      color: white;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .hero-btns { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
    }
    .btn-primary { background: #d63384; color: white; border: none; }
    .btn-primary:hover { background: #b02070; }
    .btn-outline { background: transparent; color: #d63384; border: 2px solid #d63384; }
    .btn-outline:hover { background: #d63384; color: white; }

    /* ── Sections ── */
    section { padding: 5rem 2rem; max-width: 900px; margin: 0 auto; }
    section h2 {
      font-size: 2rem;
      font-weight: 700;
      color: #d63384;
      margin-bottom: 0.5rem;
    }
    .section-divider {
      width: 60px; height: 4px;
      background: #d63384;
      border-radius: 2px;
      margin-bottom: 2rem;
    }
