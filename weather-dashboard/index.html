<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
      transition: background 1s ease;
    }

    /* ── Backgrounds ── */
    .bg-sunny { background: linear-gradient(135deg, #f7971e, #ffd200); }
    .bg-rainy { background: linear-gradient(135deg, #1c1c2e, #2d3561); }
    .bg-cloudy { background: linear-gradient(135deg, #4b6cb7, #182848); }
    .bg-windy { background: linear-gradient(135deg, #134e5e, #71b280); }
    .bg-snowy { background: linear-gradient(135deg, #e0eafc, #cfdef3); color: #333; }
    .bg-night { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }
    .bg-default { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); }

    /* ── Canvas ── */
    #weatherCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.8rem; }

    .search { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }

    input {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 1rem;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.6); }
