<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
      transition: background 1s ease;
    }

    /* ── Backgrounds ── */
    .bg-sunny { background: linear-gradient(135deg, #f7971e, #ffd200); }
    .bg-rainy { background: linear-gradient(135deg, #1c1c2e, #2d3561); }
    .bg-cloudy { background: linear-gradient(135deg, #4b6cb7, #182848); }
    .bg-windy { background: linear-gradient(135deg, #134e5e, #71b280); }
    .bg-snowy { background: linear-gradient(135deg, #e0eafc, #cfdef3); color: #333; }
    .bg-night { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }
    .bg-default { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); }

    /* ── Canvas ── */
    #weatherCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.8rem; }

    .search { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }

    input {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 1rem;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.6); }

    button {
      padding: 0.75rem 1.25rem;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #c73652; }

    .weather-card { text-align: center; display: none; }
    .weather-card img { width: 80px; height: 80px; }
    .temp { font-size: 4rem; font-weight: bold; margin: 0.5rem 0; }
    .description { font-size: 1.2rem; text-transform: capitalize; margin-bottom: 1.5rem; color: rgba(255,255,255,0.8); }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 1rem;
    }
    .detail-item { text-align: center; }
    .detail-item .value { font-size: 1.2rem; font-weight: bold; }
    .detail-item .label { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-top: 0.25rem; }
    .location { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.25rem; }

    #error { color: #e94560; text-align: center; display: none; margin-top: 1rem; }
    .loading { text-align: center; display: none; }

    /* ── Sun rays ── */
    .sun {
      position: fixed;
      top: -80px; left: 50%;
      transform: translateX(-50%);
      width: 200px; height: 200px;
      background: radial-gradient(circle, #ffe259, #ffa751);
      border-radius: 50%;
      box-shadow: 0 0 80px 40px rgba(255,220,50,0.4);
      animation: pulse 3s infinite ease-in-out;
      z-index: 0;
      display: none;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 80px 40px rgba(255,220,50,0.4); }
      50% { box-shadow: 0 0 120px 80px rgba(255,220,50,0.6); }
    }

    /* ── Trees for wind ── */
    .trees {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      display: none;
      z-index: 0;
    }
    .tree {
      position: absolute;
      bottom: 0;
      font-size: 5rem;
      animation: sway 1.5s infinite ease-in-out;
      transform-origin: bottom center;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }

    /* ── Snow ── */
    .snowflake {
      position: fixed;
      top: -20px;
      color: white;
      font-size: 1.2rem;
      animation: snowfall linear infinite;
      z-index: 0;
    }
    @keyframes snowfall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    /* ── Clouds ── */
    .cloud {
      position: fixed;
      font-size: 4rem;
      opacity: 0.6;
      animation: drift linear infinite;
      z-index: 0;
    }
    @keyframes drift {
      0% { transform: translateX(-200px); }
      100% { transform: translateX(110vw); }
    }
  </style>
</head>
<body class="bg-default">

  <canvas id="weatherCanvas"></canvas>
  <div class="sun" id="sun"></div>
  <div class="trees" id="trees"></div>

  <div class="container">
    <h1>🌤️ Weather Dashboard</h1>
    <div class="search">
      <input type="text" id="cityInput" placeholder="Enter city name..." />
      <button onclick="getWeather()">Search</button>
    </div>
    <div class="loading" id="loading">Fetching weather...</div>
    <div id="error"></div>
    <div class="weather-card" id="weatherCard">
      <div class="location" id="location"></div>
      <img id="weatherIcon" src="" alt="weather icon" />
      <div class="temp" id="temp"></div>
      <div class="description" id="description"></div>
      <div class="details">
        <div class="detail-item">
          <div class="value" id="feelsLike"></div>
          <div class="label">Feels Like</div>
        </div>
        <div class="detail-item">
          <div class="value" id="humidity"></div>
          <div class="label">Humidity</div>
        </div>
        <div class="detail-item">
          <div class="value" id="windSpeed"></div>
          <div class="label">Wind Speed</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('weatherCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    let animationId = null;
    let particles = [];

    function clearEffects() {
      if (animationId) cancelAnimationFrame(animationId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = [];
      document.getElementById('sun').style.display = 'none';
      document.getElementById('trees').style.display = 'none';
      document.querySelectorAll('.snowflake, .cloud').forEach(el => el.remove());
      document.body.className = '';
    }

    // ── Rain ──
    function initRain() {
      for (let i = 0; i < 150; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          speed: Math.random() * 6 + 4,
          length: Math.random() * 20 + 10,
          opacity: Math.random() * 0.5 + 0.3
        });
      }
    }
    function drawRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(174, 214, 241, 0.6)';
      ctx.lineWidth = 1.5;
      particles.forEach(p => {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - 2, p.y + p.length);
        ctx.stroke();
        p.y += p.speed;
        if (p.y > canvas.height) { p.y = -p.length; p.x = Math.random() * canvas.width; }
      });
      animationId = requestAnimationFrame(drawRain);
    }
