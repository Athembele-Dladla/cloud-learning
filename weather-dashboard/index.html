<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
      transition: background 1s ease;
    }

    /* ── Backgrounds ── */
    .bg-sunny { background: linear-gradient(135deg, #f7971e, #ffd200); }
    .bg-rainy { background: linear-gradient(135deg, #1c1c2e, #2d3561); }
    .bg-cloudy { background: linear-gradient(135deg, #4b6cb7, #182848); }
    .bg-windy { background: linear-gradient(135deg, #134e5e, #71b280); }
    .bg-snowy { background: linear-gradient(135deg, #e0eafc, #cfdef3); color: #333; }
    .bg-night { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }
    .bg-default { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); }

    /* ── Canvas ── */
    #weatherCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.8rem; }

    .search { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }

    input {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 1rem;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.6); }

    button {
      padding: 0.75rem 1.25rem;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #c73652; }

    .weather-card { text-align: center; display: none; }
    .weather-card img { width: 80px; height: 80px; }
    .temp { font-size: 4rem; font-weight: bold; margin: 0.5rem 0; }
    .description { font-size: 1.2rem; text-transform: capitalize; margin-bottom: 1.5rem; color: rgba(255,255,255,0.8); }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 1rem;
    }
    .detail-item { text-align: center; }
    .detail-item .value { font-size: 1.2rem; font-weight: bold; }
    .detail-item .label { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-top: 0.25rem; }
    .location { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.25rem; }

    #error { color: #e94560; text-align: center; display: none; margin-top: 1rem; }
    .loading { text-align: center; display: none; }

    /* ── Sun rays ── */
    .sun {
      position: fixed;
      top: -80px; left: 50%;
      transform: translateX(-50%);
      width: 200px; height: 200px;
      background: radial-gradient(circle, #ffe259, #ffa751);
      border-radius: 50%;
      box-shadow: 0 0 80px 40px rgba(255,220,50,0.4);
      animation: pulse 3s infinite ease-in-out;
      z-index: 0;
      display: none;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 80px 40px rgba(255,220,50,0.4); }
      50% { box-shadow: 0 0 120px 80px rgba(255,220,50,0.6); }
    }

    /* ── Trees for wind ── */
    .trees {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      display: none;
      z-index: 0;
    }
    .tree {
      position: absolute;
      bottom: 0;
      font-size: 5rem;
      animation: sway 1.5s infinite ease-in-out;
      transform-origin: bottom center;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }

    /* ── Snow ── */
    .snowflake {
      position: fixed;
      top: -20px;
      color: white;
      font-size: 1.2rem;
      animation: snowfall linear infinite;
      z-index: 0;
    }
    @keyframes snowfall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    /* ── Clouds ── */
    .cloud {
      position: fixed;
      font-size: 4rem;
      opacity: 0.6;
      animation: drift linear infinite;
      z-index: 0;
    }
    @keyframes drift {
      0% { transform: translateX(-200px); }
      100% { transform: translateX(110vw); }
    }
  </style>
</head>
<body class="bg-default">

  <canvas id="weatherCanvas"></canvas>
  <div class="sun" id="sun"></div>
  <div class="trees" id="trees"></div>

  <div class="container">
    <h1>🌤️ Weather Dashboard</h1>
    <div class="search">
      <input type="text" id="cityInput" placeholder="Enter city name..." />
      <button onclick="getWeather()">Search</button>
    </div>
    <div class="loading" id="loading">Fetching weather...</div>
    <div id="error"></div>
    <div class="weather-card" id="weatherCard">
      <div class="location" id="location"></div>
      <img id="weatherIcon" src="" alt="weather icon" />
      <div class="temp" id="temp"></div>
      <div class="description" id="description"></div>
      <div class="details">
        <div class="detail-item">
          <div class="value" id="feelsLike"></div>
          <div class="label">Feels Like</div>
        </div>
        <div class="detail-item">
          <div class="value" id="humidity"></div>
          <div class="label">Humidity</div>
        </div>
        <div class="detail-item">
          <div class="value" id="windSpeed"></div>
          <div class="label">Wind Speed</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('weatherCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    let animationId = null;
    let particles = [];

    function clearEffects() {
      if (animationId) cancelAnimationFrame(animationId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = [];
      document.getElementById('sun').style.display = 'none';
      document.getElementById('trees').style.display = 'none';
      document.querySelectorAll('.snowflake, .cloud').forEach(el => el.remove());
      document.body.className = '';
    }

    // ── Rain ──
    function initRain() {
      for (let i = 0; i < 150; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          speed: Math.random() * 6 + 4,
          length: Math.random() * 20 + 10,
          opacity: Math.random() * 0.5 + 0.3
        });
      }
    }
    function drawRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(174, 214, 241, 0.6)';
      ctx.lineWidth = 1.5;
      particles.forEach(p => {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - 2, p.y + p.length);
        ctx.stroke();
        p.y += p.speed;
        if (p.y > canvas.height) { p.y = -p.length; p.x = Math.random() * canvas.width; }
      });
      animationId = requestAnimationFrame(drawRain);
    }

    // ── Sun rays ──
    function initSun() {
      document.getElementById('sun').style.display = 'block';
      let angle = 0;
      function drawRays() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = 0;
        for (let i = 0; i < 12; i++) {
          const a = (angle + i * 30) * Math.PI / 180;
          const gradient = ctx.createLinearGradient(cx, cy, cx + Math.cos(a) * 400, cy + Math.sin(a) * 400);
          gradient.addColorStop(0, 'rgba(255,220,50,0.3)');
          gradient.addColorStop(1, 'rgba(255,220,50,0)');
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(a) * 500, cy + Math.sin(a) * 500);
          ctx.strokeStyle = gradient;
          ctx.lineWidth = 30;
          ctx.stroke();
        }
        angle += 0.3;
        animationId = requestAnimationFrame(drawRays);
      }
      drawRays();
    }

    // ── Wind / trees ──
    function initWind() {
      const treesEl = document.getElementById('trees');
      treesEl.style.display = 'block';
      treesEl.innerHTML = '';
      const positions = [5, 15, 25, 60, 72, 85, 93];
      positions.forEach((left, i) => {
        const tree = document.createElement('div');
        tree.className = 'tree';
        tree.style.left = left + '%';
        tree.style.animationDelay = (i * 0.2) + 's';
        tree.style.animationDuration = (1 + Math.random() * 0.8) + 's';
        tree.textContent = '🌲';
        treesEl.appendChild(tree);
      });

      // wind lines
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          speed: Math.random() * 8 + 4,
          length: Math.random() * 60 + 30,
          opacity: Math.random() * 0.3 + 0.1
        });
      }
      function drawWind() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.length, p.y);
          ctx.strokeStyle = `rgba(255,255,255,${p.opacity})`;
          ctx.lineWidth = 1;
          ctx.stroke();
          p.x += p.speed;
          if (p.x > canvas.width) { p.x = -p.length; p.y = Math.random() * canvas.height; }
        });
        animationId = requestAnimationFrame(drawWind);
      }
      drawWind();
    }

    // ── Snow ──
    function initSnow() {
      for (let i = 0; i < 40; i++) {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.textContent = '❄';
        flake.style.left = Math.random() * 100 + 'vw';
        flake.style.animationDuration = (Math.random() * 4 + 3) + 's';
        flake.style.animationDelay = (Math.random() * 5) + 's';
        flake.style.fontSize = (Math.random() * 1 + 0.5) + 'rem';
        document.body.appendChild(flake);
      }
    }

    // ── Clouds ──
    function initClouds() {
      for (let i = 0; i < 5; i++) {
        const cloud = document.createElement('div');
        cloud.className = 'cloud';
        cloud.textContent = '☁️';
        cloud.style.top = (Math.random() * 40) + '%';
        cloud.style.animationDuration = (Math.random() * 20 + 15) + 's';
        cloud.style.animationDelay = (Math.random() * 10) + 's';
        cloud.style.fontSize = (Math.random() * 3 + 3) + 'rem';
        document.body.appendChild(cloud);
      }
    }

    function applyWeatherEffect(description, windSpeed, isNight) {
      clearEffects();
      const desc = description.toLowerCase();

      if (isNight) {
        document.body.classList.add('bg-night');
        initClouds();
      } else if (desc.includes('rain') || desc.includes('drizzle') || desc.includes('shower')) {
        document.body.classList.add('bg-rainy');
        initRain();
      } else if (desc.includes('snow') || desc.includes('sleet') || desc.includes('blizzard')) {
        document.body.classList.add('bg-snowy');
        initSnow();
      } else if (desc.includes('cloud') || desc.includes('overcast')) {
        document.body.classList.add('bg-cloudy');
        initClouds();
      } else if (windSpeed > 10) {
        document.body.classList.add('bg-windy');
        initWind();
      } else if (desc.includes('clear') || desc.includes('sun')) {
        document.body.classList.add('bg-sunny');
        initSun();
      } else {
        document.body.classList.add('bg-default');
      }
    }

    async function getWeather() {
      const city = document.getElementById('cityInput').value.trim();
      if (!city) return alert('Please enter a city name');

      document.getElementById('weatherCard').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      try {
        const response = await fetch(`/.netlify/functions/weather?city=${encodeURIComponent(city)}`);
        const data = await response.json();
        document.getElementById('loading').style.display = 'none';

        if (data.error) {
          document.getElementById('error').textContent = 'City not found. Please try again.';
          document.getElementById('error').style.display = 'block';
          return;
        }

        const hour = new Date().getHours();
        const isNight = hour < 6 || hour >= 19;

        applyWeatherEffect(data.description, data.wind_speed, isNight);

        document.getElementById('location').textContent = `${data.city}, ${data.country}`;
        document.getElementById('weatherIcon').src = `https://openweathermap.org/img/wn/${data.icon}@2x.png`;
        document.getElementById('temp').textContent = `${Math.round(data.temperature)}°C`;
        document.getElementById('description').textContent = data.description;
        document.getElementById('feelsLike').textContent = `${Math.round(data.feels_like)}°C`;
        document.getElementById('humidity').textContent = `${data.humidity}%`;
        document.getElementById('windSpeed').textContent = `${data.wind_speed} m/s`;
        document.getElementById('weatherCard').style.display = 'block';

      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = 'Something went wrong. Try again.';
        document.getElementById('error').style.display = 'block';
      }
    }

    document.getElementById('cityInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') getWeather();
    });

    document.getElementById('cityInput').value = 'Cape Town';
    getWeather();
  </script>
</body>
</html>
